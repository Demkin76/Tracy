[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "proof-of-action"
version = "3.0.0"
description = "Tracy: exchange and lifecycle infrastructure for AI trading agents"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3", "cryptography>=44,<49",
  "rfc8785>=0.1.4,<1", "solana>=0.40.3,<0.41", "solders>=0.29,<0.30",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
frameworks = ["langchain-core>=1,<2"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["backend*", "sdk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

